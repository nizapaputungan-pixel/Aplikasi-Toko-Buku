        const sqlSchemaText = `-- ============================================================================
-- SKEMA DATABASE MYSQL: db_bookstore
-- ============================================================================

CREATE DATABASE IF NOT EXISTS db_bookstore CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
USE db_bookstore;

-- 1. TABEL USERS (Admin & User)
CREATE TABLE IF NOT EXISTS users (
    id INT AUTO_INCREMENT PRIMARY KEY,
    nama_lengkap VARCHAR(100) NOT NULL,
    email VARCHAR(100) NOT NULL UNIQUE,
    password VARCHAR(255) NOT NULL,
    role ENUM('admin', 'user') DEFAULT 'user',
    alamat TEXT,
    created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
) ENGINE=InnoDB;

-- 2. TABEL KATEGORI BUKU
CREATE TABLE IF NOT EXISTS categories (
    id INT AUTO_INCREMENT PRIMARY KEY,
    nama_kategori VARCHAR(100) NOT NULL,
    deskripsi TEXT
) ENGINE=InnoDB;

-- 3. TABEL DATA BUKU
CREATE TABLE IF NOT EXISTS books (
    id INT AUTO_INCREMENT PRIMARY KEY,
    category_id INT NOT NULL,
    judul VARCHAR(200) NOT NULL,
    penulis VARCHAR(100) NOT NULL,
    penerbit VARCHAR(100),
    tahun_terbit YEAR,
    harga INT NOT NULL,
    stok INT DEFAULT 0,
    deskripsi TEXT,
    created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
    FOREIGN KEY (category_id) REFERENCES categories(id) ON DELETE CASCADE
) ENGINE=InnoDB;

-- 4. TABEL KERANJANG BELANJA (CARTS)
CREATE TABLE IF NOT EXISTS carts (
    id INT AUTO_INCREMENT PRIMARY KEY,
    user_id INT NOT NULL,
    book_id INT NOT NULL,
    quantity INT DEFAULT 1,
    FOREIGN KEY (user_id) REFERENCES users(id) ON DELETE CASCADE,
    FOREIGN KEY (book_id) REFERENCES books(id) ON DELETE CASCADE
) ENGINE=InnoDB;

-- 5. TABEL PESAN (CONTACT TO ADMIN)
CREATE TABLE IF NOT EXISTS messages (
    id INT AUTO_INCREMENT PRIMARY KEY,
    user_id INT NULL,
    nama_pengirim VARCHAR(100) NOT NULL,
    email_pengirim VARCHAR(100) NOT NULL,
    subjek VARCHAR(150) NOT NULL,
    pesan TEXT NOT NULL,
    created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
    FOREIGN KEY (user_id) REFERENCES users(id) ON DELETE SET NULL
) ENGINE=InnoDB;

        function escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        function formatRupiah(num) {
            return 'Rp ' + Number(num).toLocaleString('id-ID');

            const c = document.getElementById('toastContainer');
            c.innerHTML = `
                <div class="p-4 rounded-2xl text-sm font-bold shadow-lg flex items-center justify-between ${type === 'success' ? 'bg-pink-600 text-white' : 'bg-rose-900 text-pink-100'}">
                    <span><i class="fa-solid fa-circle-check mr-2"></i>${escapeHtml(msg)}</span>
                    <button onclick="this.parentElement.remove()" class="ml-4 opacity-75 hover:opacity-100">&times;</button>
                </div>
            `;
            c.classList.remove('hidden');
            setTimeout(() => { c.classList.add('hidden'); }, 3500);
        }

            if (!state.currentUser) {
                showToast("Silakan login terlebih dahulu untuk belanja.", "error");
                navigate('login');
                return;
            }
            const existing = state.carts.find(c => c.user_id === state.currentUser.id && c.book_id === bookId);
            if (existing) {
                existing.quantity += 1;
            } else {
                state.carts.push({ user_id: state.currentUser.id, book_id: bookId, quantity: 1 });
            }
            showToast("Buku berhasil ditambahkan ke keranjang!");
            renderApp();
        }

            state.carts = state.carts.filter(c => !(c.user_id === state.currentUser.id && c.book_id === bookId));

            renderApp();
        }

        function cancelEditBook() {

        function handleSaveBook(e) {
            e.preventDefault();
            const judul = document.getElementById('bookJudul').value;
            const category_id = parseInt(document.getElementById('bookCatId').value);
            const penulis = document.getElementById('bookPenulis').value;
            const penerbit = document.getElementById('bookPenerbit').value;
            const tahun_terbit = parseInt(document.getElementById('bookTahun').value);
            const harga = parseInt(document.getElementById('bookHarga').value);
            const stok = parseInt(document.getElementById('bookStok').value);
            const deskripsi = document.getElementById('bookDeskripsi').value;

            if (state.editingBookId) {
                const b = state.books.find(x => x.id === state.editingBookId);
                if (b) {
                    b.judul = judul;
                    b.category_id = category_id;
                    b.penulis = penulis;
                    b.penerbit = penerbit;
                    b.tahun_terbit = tahun_terbit;
                    b.harga = harga;
                    b.stok = stok;
                    b.deskripsi = deskripsi;
                }
                state.editingBookId = null;
                showToast("Data buku berhasil diperbarui!");
            } else {
                const newId = state.books.length > 0 ? Math.max(...state.books.map(x => x.id)) + 1 : 1;
                state.books.push({ id: newId, category_id, judul, penulis, penerbit, tahun_terbit, harga, stok, deskripsi, warna: 'from-pink-600 to-rose-800' });
                showToast("Buku baru berhasil ditambahkan!");
            }
            navigate('admin_books');
        }

        function handleSaveCategory(e) {

            const nama_kategori = document.getElementById('catNama').value;

            if (state.editingCategoryId) {

            const userCarts = state.carts.filter(c => c.user_id === u.id);

                return `

            }

            let grandTotal = 0;
            const rowsHtml = userCarts.map(item => {
                const book = state.books.find(b => b.id === item.book_id);
                if (!book) return '';
                const subtotal = book.harga * item.quantity;
                grandTotal += subtotal;
                return `
                    <div class="p-6 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                        <div>
                            <h3 class="font-bold text-slate-900">${escapeHtml(book.judul)}</h3>

                            </button>
                        </div>
                    </div>
                `;
            }).join('');

            return `

                    <h1 class="text-2xl font-extrabold text-slate-900 mb-6 flex items-center gap-3">
                        <i class="fa-solid fa-cart-shopping text-pink-600"></i> Keranjang Belanja Anda

                </div>

                            <i class="fa-solid fa-user-plus"></i>
                        </div>
                        <h1 class="text-2xl font-extrabold text-slate-900">Registrasi User Baru</h1>
                        <p class="text-xs text-slate-500 mt-1">Buat akun untuk mulai berbelanja buku favorit Anda</p>
                    </div>

                    <form onsubmit="handleRegister(event)" class="space-y-4">
                        <div>
                            <label class="block text-xs font-bold text-slate-700 mb-1.5">Nama Lengkap</label>

                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-700 mb-1.5">Alamat Email</label>
                            <input type="email" id="regEmail" required placeholder="email@contoh.com" class="w-full px-4 py-2.5 rounded-xl border border-pink-200 text-sm focus:ring-2 focus:ring-pink-500 focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-700 mb-1.5">Password</label>
                            <input type="password" id="regPassword" required placeholder="Minimal 6 karakter" class="w-full px-4 py-2.5 rounded-xl border border-pink-200 text-sm focus:ring-2 focus:ring-pink-500 focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-700 mb-1.5">Alamat Pengiriman</label>
                            <textarea id="regAlamat" rows="2" placeholder="Alamat lengkap pengiriman buku..." class="w-full px-4 py-2.5 rounded-xl border border-pink-200 text-sm focus:ring-2 focus:ring-pink-500 focus:outline-none"></textarea>
                        </div>
                        <button type="submit" class="w-full py-3 rounded-xl bg-rose-600 hover:bg-rose-700 text-white font-bold text-sm transition cursor-pointer">

                    <div class="mt-6 pt-4 border-t border-pink-50 text-center text-xs text-slate-500">

                    </div>
                </div>
            `;
        }

        function renderAdminBooks() {
            const editBook = state.editingBookId ? state.books.find(b => b.id === state.editingBookId) : null;
            return `
                ${renderAdminHeader()}
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                    <div class="bg-white rounded-3xl border border-pink-100 p-6 shadow-sm h-fit">
                        <h2 class="text-lg font-extrabold text-slate-900 mb-4 flex items-center gap-2">
                            <i class="fa-solid ${editBook ? 'fa-pen-to-square text-amber-500' : 'fa-plus-circle text-pink-600'}"></i>
                            ${editBook ? 'Edit Data Buku' : 'Tambah Buku Baru'}
                        </h2>
                        <form onsubmit="handleSaveBook(event)" class="space-y-3.5">
                            <div>
                                <label class="block text-xs font-bold text-slate-700 mb-1">Judul Buku</label>
                                <input type="text" id="bookJudul" required value="${escapeHtml(editBook?.judul || '')}" class="w-full px-3.5 py-2 rounded-xl border border-pink-200 text-sm">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-700 mb-1">Kategori</label>
                                <select id="bookCatId" required class="w-full px-3.5 py-2 rounded-xl border border-pink-200 text-sm">
                                    ${state.categories.map(c => `<option value="${c.id}" ${editBook?.category_id == c.id ? 'selected' : ''}>${escapeHtml(c.nama_kategori)}</option>`).join('')}
                                </select>
                            </div>
                            <div class="grid grid-cols-2 gap-3">
                                <div>
                                    <label class="block text-xs font-bold text-slate-700 mb-1">Penulis</label>
                                    <input type="text" id="bookPenulis" required value="${escapeHtml(editBook?.penulis || '')}" class="w-full px-3.5 py-2 rounded-xl border border-pink-200 text-sm">
                                </div>
                                <div>
                                    <label class="block text-xs font-bold text-slate-700 mb-1">Penerbit</label>
                                    <input type="text" id="bookPenerbit" value="${escapeHtml(editBook?.penerbit || '')}" class="w-full px-3.5 py-2 rounded-xl border border-pink-200 text-sm">
                                </div>
                            </div>
                            <div class="grid grid-cols-3 gap-2">
                                <div>
                                    <label class="block text-xs font-bold text-slate-700 mb-1">Tahun</label>
                                    <input type="number" id="bookTahun" value="${editBook?.tahun_terbit || 2026}" class="w-full px-3 py-2 rounded-xl border border-pink-200 text-sm">
                                </div>
                                <div>
                                    <label class="block text-xs font-bold text-slate-700 mb-1">Harga (Rp)</label>
                                    <input type="number" id="bookHarga" required value="${editBook?.harga || ''}" class="w-full px-3 py-2 rounded-xl border border-pink-200 text-sm">
                                </div>
                                <div>
                                    <label class="block text-xs font-bold text-slate-700 mb-1">Stok</label>
                                    <input type="number" id="bookStok" required value="${editBook?.stok ?? 10}" class="w-full px-3 py-2 rounded-xl border border-pink-200 text-sm">
                                </div>
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-700 mb-1">Sinopsis / Deskripsi</label>
                                <textarea id="bookDeskripsi" rows="3" class="w-full px-3.5 py-2 rounded-xl border border-pink-200 text-sm">${escapeHtml(editBook?.deskripsi || '')}</textarea>
                            </div>
                            <div class="flex gap-2 pt-2">
                                <button type="submit" class="flex-1 py-2.5 rounded-xl bg-pink-600 hover:bg-pink-700 text-white font-bold text-sm transition cursor-pointer">
                                    ${editBook ? 'Update Buku' : 'Simpan Buku'}
                                </button>
                                ${editBook ? `<button type="button" onclick="cancelEditBook()" class="px-4 py-2.5 rounded-xl bg-slate-200 text-slate-700 font-semibold text-sm cursor-pointer">Batal</button>` : ''}
                            </div>
                        </form>
                    </div>

                    <div class="lg:col-span-2 bg-white rounded-3xl border border-pink-100 overflow-hidden shadow-sm">
                        <div class="p-6 border-b border-pink-50">
                            <h2 class="text-lg font-extrabold text-slate-900">Daftar Inventaris Buku</h2>
                        </div>
                        <div class="overflow-x-auto">
                            <table class="w-full text-left border-collapse">
                                <thead>
                                    <tr class="bg-pink-50/70 text-slate-600 text-xs uppercase border-b border-pink-100">
                                        <th class="py-3.5 px-4">Buku & Penulis</th>
                                        <th class="py-3.5 px-4">Kategori</th>
                                        <th class="py-3.5 px-4">Harga</th>
                                        <th class="py-3.5 px-4">Stok</th>
                                        <th class="py-3.5 px-4 text-right">Aksi</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-pink-50 text-sm">
                                    ${state.books.map(b => {
                                        const catName = state.categories.find(c => c.id == b.category_id)?.nama_kategori || 'Umum';
                                        return `
                                            <tr class="hover:bg-pink-50/40">
                                                <td class="py-3.5 px-4">
                                                    <div class="font-bold text-slate-900">${escapeHtml(b.judul)}</div>
                                                    <div class="text-xs text-slate-500">${escapeHtml(b.penulis)} (${b.tahun_terbit})</div>
                                                </td>
                                                <td class="py-3.5 px-4">
                                                    <span class="px-2.5 py-1 rounded-lg bg-pink-50 text-pink-700 text-xs font-semibold">${escapeHtml(catName)}</span>
                                                </td>
                                                <td class="py-3.5 px-4 font-semibold">${formatRupiah(b.harga)}</td>
                                                <td class="py-3.5 px-4">
                                                    <span class="font-bold ${b.stok < 5 ? 'text-rose-600' : 'text-emerald-600'}">${b.stok}</span>
                                                </td>
                                                <td class="py-3.5 px-4 text-right whitespace-nowrap">
                                                    <button onclick="startEditBook(${b.id})" class="p-2 rounded-lg bg-amber-50 text-amber-600 hover:bg-amber-100 mr-1 cursor-pointer" title="Edit">
                                                        <i class="fa-solid fa-pen"></i>
                                                    </button>
                                                    <button onclick="deleteBook(${b.id})" class="p-2 rounded-lg bg-rose-50 text-rose-600 hover:bg-rose-100 cursor-pointer" title="Hapus">
                                                        <i class="fa-solid fa-trash"></i>
                                                    </button>
                                                </td>
                                            </tr>
                                        `;
                                    }).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderAdminCategories() {
            const editCat = state.editingCategoryId ? state.categories.find(c => c.id === state.editingCategoryId) : null;
            return `
                ${renderAdminHeader()}
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                    <div class="bg-white rounded-3xl border border-pink-100 p-6 shadow-sm h-fit">
                        <h2 class="text-lg font-extrabold text-slate-900 mb-4">
                            ${editCat ? 'Update Kategori' : 'Tambah Kategori Buku'}

                        <form onsubmit="handleSaveCategory(event)" class="space-y-4">
                            <div>
                                <label class="block text-xs font-bold text-slate-700 mb-1">Nama Kategori</label>
                                <input type="text" id="catNama" required value="${escapeHtml(editCat?.nama_kategori || '')}" placeholder="Contoh: Teknologi Informasi" class="w-full px-3.5 py-2.5 rounded-xl border border-pink-200 text-sm">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-700 mb-1">Deskripsi Singkat</label>

                            <div class="flex gap-2">
                                <button type="submit" class="flex-1 py-2.5 rounded-xl bg-pink-600 hover:bg-pink-700 text-white font-bold text-sm cursor-pointer">
                                    ${editCat ? 'Update Kategori' : 'Simpan Kategori'}
                                </button>
                                ${editCat ? `<button type="button" onclick="cancelEditCat()" class="px-4 py-2.5 rounded-xl bg-slate-200 text-slate-700 font-semibold text-sm cursor-pointer">Batal</button>` : ''}
                            </div>
                        </form>
                    </div>

                    <div class="lg:col-span-2 bg-white rounded-3xl border border-pink-100 overflow-hidden shadow-sm">
                        <div class="p-6 border-b border-pink-50">
                            <h2 class="text-lg font-extrabold text-slate-900">Daftar Kategori Buku</h2>
                        </div>
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="bg-pink-50/70 text-slate-600 text-xs uppercase border-b border-pink-100">
                                    <th class="py-3.5 px-6">ID</th>
                                    <th class="py-3.5 px-6">Nama Kategori</th>
                                    <th class="py-3.5 px-6">Deskripsi</th>
                                    <th class="py-3.5 px-6 text-right">Aksi</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-pink-50 text-sm">
                                ${state.categories.map(c => `
                                    <tr class="hover:bg-pink-50/40">
                                        <td class="py-3.5 px-6 font-mono text-xs text-slate-400">#${c.id}</td>
                                        <td class="py-3.5 px-6 font-bold text-slate-900">${escapeHtml(c.nama_kategori)}</td>
                                        <td class="py-3.5 px-6 text-slate-500 text-xs">${escapeHtml(c.deskripsi)}</td>
                                        <td class="py-3.5 px-6 text-right whitespace-nowrap">
                                            <button onclick="startEditCat(${c.id})" class="p-2 rounded-lg bg-amber-50 text-amber-600 hover:bg-amber-100 mr-1 cursor-pointer">
                                                <i class="fa-solid fa-pen"></i>
                                            </button>
                                            <button onclick="deleteCat(${c.id})" class="p-2 rounded-lg bg-rose-50 text-rose-600 hover:bg-rose-100 cursor-pointer">
                                                <i class="fa-solid fa-trash"></i>
                                            </button>
                                        </td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        function renderAdminUsers() {
            return `
                ${renderAdminHeader()}
                <div class="bg-white rounded-3xl border border-pink-100 overflow-hidden shadow-sm">
                    <div class="p-6 border-b border-pink-50 flex items-center justify-between">
                        <div>
                            <h2 class="text-lg font-extrabold text-slate-900">Daftar Pengguna (User & Admin) Terdaftar</h2>
                            <p class="text-xs text-slate-500 mt-0.5">Memantau seluruh akun yang telah melakukan registrasi pada sistem</p>
                        </div>
                        <span class="px-3 py-1 rounded-full bg-pink-50 text-pink-700 text-xs font-bold">Total: ${state.users.length} Akun</span>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="bg-pink-50/70 text-slate-600 text-xs uppercase border-b border-pink-100">
                                    <th class="py-3.5 px-6">ID</th>
                                    <th class="py-3.5 px-6">Nama Lengkap</th>
                                    <th class="py-3.5 px-6">Email</th>
                                    <th class="py-3.5 px-6">Role / Peran</th>
                                    <th class="py-3.5 px-6">Alamat</th>
                                    <th class="py-3.5 px-6">Tanggal Daftar</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-pink-50 text-sm">
                                ${state.users.map(u => `
                                    <tr class="hover:bg-pink-50/40">
                                        <td class="py-3.5 px-6 font-mono text-xs text-slate-400">#${u.id}</td>
                                        <td class="py-3.5 px-6 font-bold text-slate-900">${escapeHtml(u.nama_lengkap)}</td>
                                        <td class="py-3.5 px-6 text-slate-600">${escapeHtml(u.email)}</td>
                                        <td class="py-3.5 px-6">
                                            <span class="px-2.5 py-1 rounded-full text-xs font-bold uppercase ${u.role === 'admin' ? 'bg-amber-100 text-amber-800' : 'bg-pink-100 text-pink-800'}">
                                                ${u.role}
                                            </span>
                                        </td>
                                        <td class="py-3.5 px-6 text-xs text-slate-500">${escapeHtml(u.alamat || '-')}</td>
                                        <td class="py-3.5 px-6 text-xs text-slate-400">${escapeHtml(u.created_at)}</td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        function renderAdminMessages() {
            return `
                ${renderAdminHeader()}
                <div class="bg-white rounded-3xl border border-pink-100 overflow-hidden shadow-sm">
                    <div class="p-6 border-b border-pink-50">
                        <h2 class="text-lg font-extrabold text-slate-900">Pesan Masuk dari User (Contact to Admin)</h2>
                    </div>
                    <div class="divide-y divide-pink-50">
                        ${state.messages.length === 0 ? `<div class="p-8 text-center text-slate-500 text-sm">Belum ada pesan masuk.</div>` :
                            state.messages.slice().reverse().map(m => `
                                <div class="p-6 hover:bg-pink-50/40">
                                    <div class="flex flex-wrap items-center justify-between gap-2 mb-2">
                                        <div>
                                            <span class="font-bold text-slate-900">${escapeHtml(m.nama_pengirim)}</span>
                                            <span class="text-xs text-slate-500 ml-2">&lt;${escapeHtml(m.email_pengirim)}&gt;</span>
                                        </div>
                                        <span class="text-xs text-slate-400">${escapeHtml(m.created_at)}</span>
                                    </div>
                                    <div class="text-xs font-bold text-pink-600 mb-1">Subjek: ${escapeHtml(m.subjek)}</div>
                                    <p class="text-sm text-slate-700 bg-pink-50/50 p-3.5 rounded-xl border border-pink-100">${escapeHtml(m.pesan)}</p>
                                </div>
                            `).join('')
                        }
                    </div>
                </div>
            `;
        }

        function renderSqlSchema() {
            return `
                <div class="bg-white rounded-3xl border border-pink-100 p-6 sm:p-8 shadow-sm">
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6 pb-6 border-b border-pink-50">

                            <span class="px-3 py-1 rounded-full bg-rose-100 text-rose-800 text-xs font-bold">Arsitektur Database Relasional</span>
                            <h1 class="text-2xl font-extrabold text-slate-900 mt-2">Rancangan Skema SQL (MySQL)</h1>
                            <p class="text-sm text-slate-500 mt-1">Struktur 5 tabel lengkap dengan Primary Key dan Foreign Key Constraints.</p>
                        </div>
                        <button onclick="copySQL()" id="btnCopySql" class="px-5 py-2.5 rounded-xl bg-rose-950 hover:bg-rose-900 text-white text-sm font-semibold flex items-center gap-2 self-start transition cursor-pointer">
                            <i class="fa-regular fa-copy"></i> Salin Query SQL
                        </button>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-5 gap-3 mb-6 text-xs">
                        <div class="p-3.5 rounded-2xl bg-pink-50/60 border border-pink-100">
                            <div class="font-bold text-pink-700 mb-1"><i class="fa-solid fa-table mr-1"></i> users</div>
                            <div class="text-slate-500">id (PK), nama_lengkap, email, password, role</div>
                        </div>
                        <div class="p-3.5 rounded-2xl bg-pink-50/60 border border-pink-100">
                            <div class="font-bold text-pink-700 mb-1"><i class="fa-solid fa-table mr-1"></i> categories</div>
                            <div class="text-slate-500">id (PK), nama_kategori, deskripsi</div>
                        </div>
                        <div class="p-3.5 rounded-2xl bg-pink-50/60 border border-pink-100">
                            <div class="font-bold text-pink-700 mb-1"><i class="fa-solid fa-table mr-1"></i> books</div>
                            <div class="text-slate-500">id (PK), category_id (FK), judul, penulis, harga, stok</div>
                        </div>
                        <div class="p-3.5 rounded-2xl bg-pink-50/60 border border-pink-100">
                            <div class="font-bold text-pink-700 mb-1"><i class="fa-solid fa-table mr-1"></i> carts</div>
                            <div class="text-slate-500">id (PK), user_id (FK), book_id (FK), quantity</div>
                        </div>
                        <div class="p-3.5 rounded-2xl bg-pink-50/60 border border-pink-100">
                            <div class="font-bold text-pink-700 mb-1"><i class="fa-solid fa-table mr-1"></i> messages</div>
                            <div class="text-slate-500">id (PK), user_id (FK), subjek, pesan</div>
                        </div>
                    </div>

                    <textarea id="sqlCodeArea" readonly rows="22" class="w-full p-5 rounded-2xl bg-rose-950 text-pink-200 font-mono text-xs leading-relaxed focus:outline-none">${escapeHtml(sqlSchemaText)}</textarea>
                </div>
            `;
        }

        // Initialize App on load
        window.onload = function() {
            renderApp();
        };
    </script>
</body>
</html>
